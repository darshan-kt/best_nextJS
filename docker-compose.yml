# Docker Compose configuration for the LMS platform.
#
# Services:
#   postgres  - PostgreSQL database
#   redis     - Redis cache/rate limiter
#   migrate   - One-off Prisma database migrations
#   seed      - One-off database seeding
#   app       - Next.js / Node.js application
#
# Full stack:
#   docker compose --profile full up -d --build

services:

  # ---------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms

    ports:
      - "5433:5432"

    volumes:
      - lms-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------------------------------------------------
  # Database migrations
  # One-off service
  # ---------------------------------------------------------------------
  migrate:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms

    command:
      - pnpm
      - exec
      - prisma
      - migrate
      - deploy


  # ---------------------------------------------------------------------
  # Database seed
  # One-off service
  # ---------------------------------------------------------------------
  seed:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms

    command:
      - pnpm
      - db:seed


  # ---------------------------------------------------------------------
  # Next.js / Node.js application
  # ---------------------------------------------------------------------
  app:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile

    container_name: lms-app
    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

      seed:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      # Docker-internal PostgreSQL address
      DATABASE_URL: postgresql://lms:lms@postgres:5432/lms

      # Docker-internal Redis address
      REDIS_URL: redis://redis:6379

      # Auth.js canonical application URL — read from .env so the same
      # compose file works for a local run (default: localhost) and an
      # AWS deploy (set AUTH_URL to the instance's real origin in .env).
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}

      # Production mode
      NODE_ENV: production

    ports:
      - "3000:3000"


# -----------------------------------------------------------------------
# Persistent volumes
# -----------------------------------------------------------------------
volumes:
  lms-postgres-data:
