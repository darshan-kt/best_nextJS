<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
  <text x="64" y="62" font-size="34" font-weight="800" fill="#134e4a">LAB 3 · what counts as an event</text>
  <text x="64" y="94" font-size="19" fill="#64748b">The robot does not move. Things cross in front of it, and each crossing starts a clock.</text>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- sector -->
  <path d="M 260 400 L 700 190 A 500 500 0 0 1 700 610 Z" fill="#ccfbf1" opacity="0.55"/>
  <line x1="260" y1="400" x2="716" y2="186" stroke="#0f766e" stroke-width="2"/>
  <line x1="260" y1="400" x2="716" y2="614" stroke="#0f766e" stroke-width="2"/>
  <text x="470" y="404" font-size="18" font-weight="700" fill="#0f766e">watched sector (60°)</text>

  <!-- robot -->
  <rect x="196" y="372" width="120" height="60" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <circle cx="256" cy="400" r="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="150" y="478" font-size="17" font-weight="700" fill="#0f766e">Robot, stationary</text>
  <text x="150" y="502" font-size="15" fill="#475569">This lab moves nothing.</text>

  <!-- threshold arc -->
  <path d="M 592 328 A 350 350 0 0 1 592 472" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="604" y="330" font-size="16" font-weight="700" fill="#b91c1c">threshold — closer than this is an event</text>

  <!-- release arc -->
  <path d="M 660 306 A 420 420 0 0 1 660 494" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="4 6"/>
  <text x="672" y="512" font-size="16" font-weight="700" fill="#b45309">release — must retreat past here first</text>

  <!-- crossing person -->
  <g transform="translate(880,150)">
    <circle cx="0" cy="0" r="16" fill="#334155"/>
    <line x1="0" y1="16" x2="0" y2="64" stroke="#334155" stroke-width="6"/>
    <line x1="-22" y1="88" x2="0" y2="64" stroke="#334155" stroke-width="6"/>
    <line x1="22" y1="88" x2="0" y2="64" stroke="#334155" stroke-width="6"/>
  </g>
  <line x1="880" y1="270" x2="880" y2="560" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a3)"/>
  <text x="900" y="270" font-size="16" fill="#334155">a crossing: enters, passes, leaves</text>

  <g transform="translate(880,560)">
    <rect x="-40" y="16" width="360" height="52" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="-24" y="38" font-size="15" font-weight="700" fill="#b91c1c">One crossing = ONE event.</text>
    <text x="-24" y="58" font-size="15" fill="#475569">Someone who stops and lingers is still one.</text>
  </g>

  <g transform="translate(64,150)">
    <rect x="0" y="0" width="330" height="176" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="20" y="34" font-size="17" font-weight="700" fill="#b45309">Why the two arcs differ</text>
    <text x="20" y="64" font-size="15" fill="#475569">A target sitting exactly on one</text>
    <text x="20" y="88" font-size="15" fill="#475569">line generates hundreds of fake</text>
    <text x="20" y="112" font-size="15" fill="#475569">events as noise pushes it back</text>
    <text x="20" y="136" font-size="15" fill="#475569">and forth. Those are not</text>
    <text x="20" y="160" font-size="15" font-weight="700" fill="#b91c1c">independent — the model breaks.</text>
  </g>
</svg>
