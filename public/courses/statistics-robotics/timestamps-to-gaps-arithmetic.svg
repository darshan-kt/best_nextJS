<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="620" fill="#ffffff"/>
  <text x="64" y="62" font-size="34" font-weight="800" fill="#134e4a">Six timestamps make five waiting times</text>
  <text x="64" y="94" font-size="19" fill="#64748b">The conversion is one subtraction per adjacent pair — and the first event never produces one.</text>

  <!-- Column headers -->
  <g font-size="17" font-weight="700" fill="#0f172a">
    <text x="96" y="168">Event i</text>
    <text x="236" y="168">t_i  (s)</text>
    <text x="430" y="168">Δt_i = t_i − t_(i−1)</text>
    <text x="800" y="168">Result (s)</text>
  </g>
  <line x1="80" y1="184" x2="1000" y2="184" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Rows -->
  <g font-size="18" fill="#0f172a" font-variant-numeric="tabular-nums">
    <text x="96" y="224">0</text>
    <text x="236" y="224" fill="#be185d" font-weight="700">4.2</text>
    <text x="430" y="224" fill="#94a3b8" font-style="italic">no previous event</text>
    <text x="800" y="224" fill="#94a3b8">—</text>

    <text x="96" y="272">1</text>
    <text x="236" y="272" fill="#be185d" font-weight="700">11.6</text>
    <text x="430" y="272">11.6 − 4.2</text>
    <text x="800" y="272" fill="#0f766e" font-weight="700">7.4</text>

    <text x="96" y="320">2</text>
    <text x="236" y="320" fill="#be185d" font-weight="700">14.4</text>
    <text x="430" y="320">14.4 − 11.6</text>
    <text x="800" y="320" fill="#0f766e" font-weight="700">2.8</text>

    <text x="96" y="368">3</text>
    <text x="236" y="368" fill="#be185d" font-weight="700">27.1</text>
    <text x="430" y="368">27.1 − 14.4</text>
    <text x="800" y="368" fill="#0f766e" font-weight="700">12.7</text>

    <text x="96" y="416">4</text>
    <text x="236" y="416" fill="#be185d" font-weight="700">31.2</text>
    <text x="430" y="416">31.2 − 27.1</text>
    <text x="800" y="416" fill="#0f766e" font-weight="700">4.1</text>

    <text x="96" y="464">5</text>
    <text x="236" y="464" fill="#be185d" font-weight="700">45.5</text>
    <text x="430" y="464">45.5 − 31.2</text>
    <text x="800" y="464" fill="#0f766e" font-weight="700">14.3</text>
  </g>

  <line x1="80" y1="490" x2="1000" y2="490" stroke="#cbd5e1" stroke-width="2"/>
  <g font-size="17" font-weight="700">
    <text x="96" y="524" fill="#be185d">6 timestamps</text>
    <text x="430" y="524" fill="#64748b">give</text>
    <text x="800" y="524" fill="#0f766e">5 waiting times</text>
  </g>

  <!-- The two claims that matter -->
  <g transform="translate(1030,150)">
    <rect x="0" y="0" width="212" height="150" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="18" y="34" font-size="16" font-weight="700" fill="#0f766e">Δt is the variable</text>
    <text x="18" y="62" font-size="14" fill="#134e4a">The timestamps only</text>
    <text x="18" y="82" font-size="14" fill="#134e4a">climb. They carry no</text>
    <text x="18" y="102" font-size="14" fill="#134e4a">distribution worth</text>
    <text x="18" y="122" font-size="14" fill="#134e4a">modelling.</text>
  </g>

  <g transform="translate(1030,330)">
    <rect x="0" y="0" width="212" height="150" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="18" y="34" font-size="16" font-weight="700" fill="#be185d">n events → n−1 gaps</text>
    <text x="18" y="62" font-size="14" fill="#831843">Off-by-one here shifts</text>
    <text x="18" y="82" font-size="14" fill="#831843">every gap by one</text>
    <text x="18" y="102" font-size="14" fill="#831843">position and quietly</text>
    <text x="18" y="122" font-size="14" fill="#831843">changes λ̂.</text>
  </g>

  <text x="64" y="586" font-size="16" fill="#64748b">Order matters: the gaps are only meaningful if the timestamps were sorted first. An unsorted log produces negative waiting times.</text>
</svg>
