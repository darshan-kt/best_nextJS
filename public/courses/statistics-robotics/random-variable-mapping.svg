<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="600" fill="#ffffff"/>
  <text x="64" y="62" font-size="34" font-weight="800" fill="#134e4a">A random variable maps outcomes to numbers</text>
  <text x="64" y="94" font-size="19" fill="#64748b">X is the rule. x is one number the rule produced.</text>

  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <g transform="translate(80,150)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">Outcomes — one scan of the wall</text>
    <rect x="0" y="20" width="330" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <g font-size="15" fill="#475569">
      <circle cx="70" cy="80" r="7" fill="#0f766e"/><text x="92" y="86">beam returns at t₁</text>
      <circle cx="70" cy="140" r="7" fill="#0f766e"/><text x="92" y="146">beam returns at t₂</text>
      <circle cx="70" cy="200" r="7" fill="#0f766e"/><text x="92" y="206">beam returns at t₃</text>
      <circle cx="70" cy="260" r="7" fill="#0f766e"/><text x="92" y="266">beam returns at t₄</text>
      <text x="92" y="316" font-size="15" fill="#94a3b8">…and so on</text>
    </g>
  </g>

  <g stroke="#0f766e" stroke-width="2.5" marker-end="url(#m)" fill="none">
    <path d="M 420 230 L 700 218"/>
    <path d="M 420 290 L 700 268"/>
    <path d="M 420 350 L 700 318"/>
    <path d="M 420 410 L 700 368"/>
  </g>
  <text x="500" y="196" font-size="20" font-weight="700" fill="#0f766e">X</text>
  <text x="470" y="446" font-size="15" fill="#64748b">"the measured distance, in metres"</text>

  <g transform="translate(720,150)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">Numbers — realizations of X</text>
    <rect x="0" y="20" width="330" height="330" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <g font-size="20" font-weight="600" fill="#0f172a" font-variant-numeric="tabular-nums">
      <text x="40" y="86">x₁ = 2.01 m</text>
      <text x="40" y="146">x₂ = 1.98 m</text>
      <text x="40" y="206">x₃ = 2.03 m</text>
      <text x="40" y="266">x₄ = 1.99 m</text>
      <text x="40" y="320" font-size="15" font-weight="400" fill="#94a3b8">…and so on</text>
    </g>
  </g>

  <g transform="translate(80,500)">
    <rect x="0" y="0" width="1120" height="70" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="24" y="30" font-size="17" font-weight="700" fill="#a16207">Capital X, lowercase x</text>
    <text x="24" y="56" font-size="16" fill="#475569">X is the whole mapping — everything that could come out, and how often. x₃ is one value it produced on one occasion. Asking "what is X?" and "what is x₃?" are different questions.</text>
  </g>
</svg>
