<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
  <text x="64" y="62" font-size="34" font-weight="800" fill="#134e4a">Three levels of evidence</text>
  <text x="64" y="94" font-size="19" fill="#64748b">They answer different questions. None of them substitutes for another.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g transform="translate(64,150)">
    <rect x="0" y="0" width="340" height="250" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#0f766e">1 · Theory</text>
    <text x="24" y="82" font-size="16" fill="#475569">What the model says should</text>
    <text x="24" y="104" font-size="16" fill="#475569">happen, derived from its</text>
    <text x="24" y="126" font-size="16" fill="#475569">assumptions.</text>
    <text x="24" y="170" font-size="15" font-weight="700" fill="#0f172a">Proves: internal consistency</text>
    <text x="24" y="200" font-size="15" fill="#b91c1c">Proves nothing about your robot</text>
    <text x="24" y="228" font-size="14" fill="#64748b">"σ² of a uniform is (b−a)²/12"</text>
  </g>

  <line x1="416" y1="275" x2="464" y2="275" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(472,150)">
    <rect x="0" y="0" width="340" height="250" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#1d4ed8">2 · Simulation</text>
    <text x="24" y="82" font-size="16" fill="#475569">What a generator that obeys</text>
    <text x="24" y="104" font-size="16" fill="#475569">the model actually produces,</text>
    <text x="24" y="126" font-size="16" fill="#475569">at finite sample size.</text>
    <text x="24" y="170" font-size="15" font-weight="700" fill="#0f172a">Proves: sampling variability</text>
    <text x="24" y="200" font-size="15" fill="#b91c1c">Proves nothing about your robot</text>
    <text x="24" y="228" font-size="14" fill="#64748b">"800 draws are not perfectly flat"</text>
  </g>

  <line x1="824" y1="275" x2="872" y2="275" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(880,150)">
    <rect x="0" y="0" width="336" height="250" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#c2410c">3 · Reality</text>
    <text x="24" y="82" font-size="16" fill="#475569">What your sensor, in your</text>
    <text x="24" y="104" font-size="16" fill="#475569">room, on your robot,</text>
    <text x="24" y="126" font-size="16" fill="#475569">actually recorded.</text>
    <text x="24" y="170" font-size="15" font-weight="700" fill="#0f172a">Proves: what happened, once</text>
    <text x="24" y="200" font-size="15" fill="#0f172a">The only level that can</text>
    <text x="24" y="222" font-size="15" font-weight="700" fill="#0f172a">falsify the model</text>
  </g>

  <g transform="translate(64,440)">
    <rect x="0" y="0" width="1152" height="140" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="24" y="42" font-size="20" font-weight="800" fill="#b91c1c">A simulation is never validation</text>
    <text x="24" y="78" font-size="16" fill="#475569">A simulation shows that a model behaves the way the model says it behaves. That is a check on your arithmetic, not on your robot.</text>
    <text x="24" y="106" font-size="16" fill="#475569">When this course shows you a simulated result beside a recorded one, the recorded one is the evidence. The simulation is the prediction being tested.</text>
  </g>
</svg>
