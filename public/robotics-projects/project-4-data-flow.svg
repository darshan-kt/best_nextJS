<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="70" font-size="32" font-weight="800" fill="#7c2d12">Project 4 &#8212; Data Flow</text>
  <text x="64" y="102" font-size="18" fill="#64748b">Autonomous Navigation: closing the loop with Nav2.</text>
  <rect x="64" y="300" width="260" height="200" rx="16" fill="#fff1ea" stroke="#c2410c" stroke-width="2.5"/>
  <text x="194" y="366" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">Map + /scan + /odom</text>
  <text x="194" y="412" text-anchor="middle" font-size="14" fill="#c2410c">Project 3's map +</text>
  <text x="194" y="432" text-anchor="middle" font-size="14" fill="#c2410c">live sensors</text>
  <rect x="361" y="300" width="260" height="200" rx="16" fill="#fff1ea" stroke="#c2410c" stroke-width="2.5"/>
  <text x="491" y="366" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">AMCL + Costmaps</text>
  <text x="491" y="412" text-anchor="middle" font-size="14" fill="#c2410c">localization +</text>
  <text x="491" y="432" text-anchor="middle" font-size="14" fill="#c2410c">local/global obstacle layers</text>
  <rect x="659" y="300" width="260" height="200" rx="16" fill="#fff1ea" stroke="#c2410c" stroke-width="2.5"/>
  <text x="789" y="366" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">Planner + Controller</text>
  <text x="789" y="412" text-anchor="middle" font-size="14" fill="#c2410c">bt_navigator &#8594; global</text>
  <text x="789" y="432" text-anchor="middle" font-size="14" fill="#c2410c">path &#8594; local trajectory</text>
  <rect x="956" y="300" width="260" height="200" rx="16" fill="#fff1ea" stroke="#c2410c" stroke-width="2.5"/>
  <text x="1086" y="366" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">/cmd_vel</text>
  <text x="1086" y="412" text-anchor="middle" font-size="14" fill="#c2410c">existing base driver</text>
  <text x="1086" y="432" text-anchor="middle" font-size="14" fill="#c2410c">&#8594; motors</text>
  <g stroke="#ea580c" stroke-width="5" fill="none" marker-end="url(#arrow-coral)">
    <line x1="324" y1="400" x2="361" y2="400"/>
    <line x1="621" y1="400" x2="659" y2="400"/>
    <line x1="919" y1="400" x2="956" y2="400"/>
  </g>
  <text x="640" y="570" text-anchor="middle" font-size="18" fill="#475569">The only project in this course with a hard dependency on another project's output.</text>
