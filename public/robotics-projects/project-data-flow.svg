<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>

  <text x="64" y="56" font-size="30" font-weight="800" fill="#134e4a">Course Project Data Flow</text>
  <text x="64" y="86" font-size="17" fill="#64748b">Module 0 is the shared foundation every project builds on — but only Project 4 depends on another project's output.</text>

  <!-- Module 0 -->
  <rect x="390" y="130" width="500" height="100" rx="14" fill="#0f172a" stroke="#0d9488" stroke-width="2.5"/>
  <text x="640" y="172" text-anchor="middle" font-size="18" font-weight="800" fill="#5eead4">Module 0</text>
  <text x="640" y="198" text-anchor="middle" font-size="13" font-weight="400" fill="#99f6e4">Sensors + base bring-up: robot_description, robot_bringup, TF tree</text>

  <!-- three branch arrows -->
  <g stroke="#0d9488" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
    <path d="M 500 230 C 500 280, 220 280, 220 330"/>
    <path d="M 640 230 L 640 330"/>
    <path d="M 780 230 C 780 280, 1000 280, 1000 330"/>
  </g>

  <!-- Project 1 -->
  <rect x="80" y="330" width="280" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="220" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">Project 1</text>
  <text x="220" y="390" text-anchor="middle" font-size="13" fill="#0f766e">Obstacle Avoidance</text>
  <text x="220" y="410" text-anchor="middle" font-size="12" fill="#0f766e">reactive, /scan only</text>

  <!-- Project 2 -->
  <rect x="500" y="330" width="280" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="640" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">Project 2</text>
  <text x="640" y="390" text-anchor="middle" font-size="13" fill="#0f766e">Visual Object Tracking</text>
  <text x="640" y="410" text-anchor="middle" font-size="12" fill="#0f766e">reactive, camera only</text>

  <!-- Project 3 -->
  <rect x="920" y="330" width="280" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1060" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">Project 3</text>
  <text x="1060" y="390" text-anchor="middle" font-size="13" fill="#0f766e">SLAM Mapping</text>
  <text x="1060" y="410" text-anchor="middle" font-size="12" fill="#0f766e">produces lab_room.yaml/.pgm</text>

  <!-- dependency arrow: Project 3 -> Project 4, distinct color -->
  <path d="M 1060 440 C 1060 520, 700 560, 700 610" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="770" y="480" width="290" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="915" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">map artifact</text>
  <text x="915" y="521" text-anchor="middle" font-size="12" font-weight="400" fill="#92400e">lab_room.yaml + lab_room.pgm</text>

  <!-- Project 4 -->
  <rect x="480" y="610" width="320" height="110" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="640" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Project 4</text>
  <text x="640" y="670" text-anchor="middle" font-size="13" fill="#92400e">Autonomous Navigation (Nav2)</text>
  <text x="640" y="690" text-anchor="middle" font-size="12" fill="#92400e">localizes against Project 3's map</text>

  <text x="640" y="748" text-anchor="middle" font-size="14" fill="#475569">Projects 1–3 each build independently on Module 0. Project 4 is the only project with a cross-project dependency — it cannot run without Project 3's saved map.</text>
</svg>
