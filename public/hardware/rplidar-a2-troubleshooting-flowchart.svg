<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="48" y="42" font-size="24" font-weight="800" fill="#134e4a">The eight-rung ladder, with this device's real signatures</text>
  <text x="48" y="66" font-size="14" fill="#64748b">Clear each rung top to bottom · each box: real failure(s) + exact logged signature</text>

  <!-- LEFT COLUMN: Connection, Power, OS Detection, Driver -->
  <g font-size="13" font-weight="700" fill="#134e4a">
    <rect x="48" y="86" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="64" y="106">1. Connection</text>
    <text x="64" y="124" font-size="11" font-weight="400" fill="#0f766e">A2M6: no dedicated launch file exists (rplidar_ros#168) — no error, just no match</text>
    <text x="64" y="138" font-size="11" font-weight="400" fill="#0f766e">signature: nothing to run</text>

    <rect x="48" y="156" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="64" y="176">2. Power</text>
    <text x="64" y="194" font-size="11" font-weight="400" fill="#0f766e">insufficient port current for 450-600 mA continuous draw</text>
    <text x="64" y="208" font-size="11" font-family="monospace" font-weight="400" fill="#b45309">"Failed to start motor: %08x"</text>

    <rect x="48" y="226" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="64" y="246">3. OS Detection</text>
    <text x="64" y="264" font-size="11" font-weight="400" fill="#0f766e">udev rule not installed/reloaded — device exists, expected path doesn't</text>
    <text x="64" y="278" font-size="11" font-family="monospace" font-weight="400" fill="#b45309">/dev/rplidar: No such file or directory</text>

    <rect x="48" y="296" width="560" height="240" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="64" y="318" fill="#78350f">4. Driver — richest rung, three real failures</text>
    <text x="64" y="340" font-size="12" font-weight="700" fill="#78350f">The Baud Rate Trap</text>
    <text x="64" y="356" font-size="11" font-weight="400" fill="#78350f">wrong SKU launch file, or bypassing it (node default 1,000,000 bps)</text>
    <text x="64" y="370" font-size="11" font-family="monospace" font-weight="400" fill="#78350f">device-info handshake fails, before scan data begins:</text>
    <text x="64" y="384" font-size="11" font-family="monospace" font-weight="700" fill="#991b1b">"Error, operation time out. SL_RESULT_OPERATION_TIMEOUT!"</text>
    <text x="64" y="412" font-size="12" font-weight="700" fill="#78350f">channel_type not "serial"</text>
    <text x="64" y="428" font-size="11" font-family="monospace" font-weight="400" fill="#78350f">"Error, cannot connect to the ip addr %s with the tcp port %s."</text>
    <text x="64" y="456" font-size="12" font-weight="700" fill="#78350f">Serial port permission denied</text>
    <text x="64" y="472" font-size="11" font-weight="400" fill="#78350f">chmod 777 not always sufficient (rplidar_ros#93) — udev rule is primary</text>
    <text x="64" y="486" font-size="11" font-family="monospace" font-weight="700" fill="#991b1b">"Error, cannot bind to the specified serial port %s."</text>
    <text x="64" y="516" font-size="11" font-weight="400" fill="#78350f">Also on this rung: internal device fault (reboot fixes it) and an invalid</text>
    <text x="64" y="530" font-size="11" font-weight="400" fill="#78350f">scan_mode override (the driver prints its own valid list — self-diagnosing)</text>
  </g>

  <!-- wraparound arrow, left column bottom to right column top -->
  <path d="M 608 380 C 660 380, 660 116, 668 116" fill="none" stroke="#0d9488" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- RIGHT COLUMN: Node (+branch), Topic, Data, Visualization -->
  <g font-size="13" font-weight="700" fill="#134e4a">
    <rect x="672" y="86" width="340" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="106">5. Node</text>
    <text x="688" y="124" font-size="11" font-weight="400" fill="#0f766e">internal fault (reboot) or invalid scan_mode</text>
    <text x="688" y="138" font-size="10" font-family="monospace" font-weight="400" fill="#b45309">"internal error detected. Please reboot..."</text>

    <!-- side branch: control surface, not on data path -->
    <rect x="1024" y="86" width="184" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1116" y="108" text-anchor="middle" font-size="11" fill="#475569">stop_motor /</text>
    <text x="1116" y="122" text-anchor="middle" font-size="11" fill="#475569">start_motor</text>
    <text x="1116" y="140" text-anchor="middle" font-size="10" font-weight="400" fill="#94a3b8">control surface —</text>
    <text x="1116" y="152" text-anchor="middle" font-size="10" font-weight="400" fill="#94a3b8">not on the data path</text>
    <line x1="1012" y1="121" x2="1020" y2="121" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

    <rect x="672" y="166" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="186">6. Topic</text>
    <text x="688" y="204" font-size="11" font-weight="400" fill="#0f766e">node started but nothing publishes — check the Node rung's own log, not this one</text>

    <rect x="672" y="236" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="256">7. Data</text>
    <text x="688" y="274" font-size="11" font-weight="400" fill="#0f766e">physical/cable disconnect mid-operation</text>
    <text x="688" y="288" font-size="11" font-family="monospace" font-weight="700" fill="#b45309">"lost connection"</text>

    <rect x="672" y="306" width="560" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="688" y="326">8. Visualization</text>
    <text x="688" y="344" font-size="11" font-weight="400" fill="#0f766e">no special QoS handling needed — RELIABLE matches RELIABLE by default</text>
    <text x="688" y="358" font-size="11" font-weight="400" fill="#0f766e">data good but nothing shown → check Displays panel / Fixed Frame</text>
  </g>

  <g stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)" fill="none">
    <line x1="952" y1="156" x2="952" y2="164"/>
    <line x1="952" y1="226" x2="952" y2="234"/>
    <line x1="952" y1="296" x2="952" y2="304"/>
  </g>

  <rect x="48" y="556" width="1184" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="580" font-size="13" font-weight="700" fill="#134e4a">Not on this ladder at all: a documentation bug</text>
  <text x="64" y="600" font-size="12" font-weight="400" fill="#475569">The official README's own udev step has a typo — "cd src/rpldiar_ros/" instead of "rplidar_ros" —</text>
  <text x="64" y="616" font-size="12" font-weight="400" fill="#475569">that's a README problem, not your environment, if you hit it following the upstream docs directly.</text>

  <text x="640" y="668" text-anchor="middle" font-size="16" fill="#475569">Debugging this device is a sequence of <tspan font-weight="700" fill="#0f172a">checkable rungs with real signatures</tspan>, not a mystery.</text>
</svg>
