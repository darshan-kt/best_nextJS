<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="leader" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="60" font-size="30" font-weight="800" fill="#134e4a">Two sensors, one housing</text>
  <text x="64" y="90" font-size="18" fill="#64748b">An RGB lens and a structured-light depth pair, sharing one enclosure and one captive cable.</text>

  <!-- device housing: horizontal bar, front view -->
  <g>
    <rect x="290" y="280" width="700" height="120" rx="18" fill="#1e293b"/>
    <!-- IR projector -->
    <circle cx="380" cy="340" r="34" fill="#0f172a" stroke="#0d9488" stroke-width="3"/>
    <circle cx="380" cy="340" r="14" fill="#134e4a"/>
    <!-- small status dots -->
    <circle cx="470" cy="325" r="5" fill="#334155"/>
    <circle cx="470" cy="355" r="5" fill="#334155"/>
    <!-- RGB lens -->
    <circle cx="640" cy="340" r="34" fill="#0f172a" stroke="#0d9488" stroke-width="3"/>
    <circle cx="640" cy="340" r="14" fill="#134e4a"/>
    <!-- IR receiver -->
    <circle cx="880" cy="340" r="34" fill="#0f172a" stroke="#0d9488" stroke-width="3"/>
    <circle cx="880" cy="340" r="14" fill="#134e4a"/>
    <!-- stand -->
    <rect x="580" y="400" width="120" height="26" rx="8" fill="#1e293b"/>
    <rect x="610" y="426" width="60" height="40" rx="10" fill="#0f172a"/>
    <!-- captive cable -->
    <path d="M 300 300 C 260 260, 240 200, 250 150" stroke="#334155" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- leaders + labels -->
  <g font-size="15" fill="#134e4a">
    <line x1="248" y1="158" x2="222" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#leader)"/>
    <rect x="40" y="175" width="180" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="130" y="200" text-anchor="middle" font-weight="700">Captive Cable</text>
    <text x="130" y="221" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">one physical cable</text>

    <line x1="380" y1="306" x2="380" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#leader)"/>
    <rect x="270" y="150" width="220" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="380" y="175" text-anchor="middle" font-weight="700">IR Projector</text>
    <text x="380" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">emits structured-light pattern</text>

    <line x1="640" y1="306" x2="640" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#leader)"/>
    <rect x="530" y="150" width="220" height="80" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="178" text-anchor="middle" font-weight="700">RGB Lens</text>
    <text x="640" y="198" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">ordinary color camera</text>
    <text x="640" y="216" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">a UVC device in its own right</text>

    <line x1="880" y1="306" x2="880" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#leader)"/>
    <rect x="790" y="150" width="220" height="60" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="900" y="175" text-anchor="middle" font-weight="700">IR Receiver</text>
    <text x="900" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">captures pattern distortion</text>

    <line x1="990" y1="340" x2="1060" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#leader)"/>
    <rect x="1060" y="300" width="180" height="80" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="1150" y="328" text-anchor="middle" font-weight="700">Housing</text>
    <text x="1150" y="348" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">one enclosure for all</text>
    <text x="1150" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#0f766e">three optical elements</text>
  </g>

  <!-- label warning callout -->
  <g>
    <rect x="290" y="500" width="700" height="150" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <text x="320" y="535" font-size="18" font-weight="800" fill="#92400e">⚠ Check the label before anything else</text>
    <text x="320" y="565" font-size="15" fill="#78350f">The printed label on the housing must read exactly</text>
    <text x="320" y="588" font-size="17" font-weight="800" fill="#78350f">"Astra Pro" — not "Astra Pro Plus."</text>
    <text x="320" y="614" font-size="15" fill="#78350f">This module's driver path only supports the plain Astra Pro.</text>
  </g>

  <text x="640" y="695" text-anchor="middle" font-size="16" fill="#475569">One physical cable, three optical elements — but two separate <tspan font-weight="700" fill="#0f172a">logical USB devices</tspan> once it reaches the host (Section F).</text>
</svg>
