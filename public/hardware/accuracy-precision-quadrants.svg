<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="64" font-size="34" font-weight="800" fill="#134e4a">Accuracy and precision are independent</text>
  <text x="64" y="96" font-size="19" fill="#64748b">Two different properties, not two words for the same idea.</text>

  <!-- helper macro-like repeated targets -->
  <g font-size="17" font-weight="700" fill="#134e4a">
    <!-- Q1: accurate + precise -->
    <g transform="translate(140,170)">
      <circle cx="80" cy="80" r="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="54" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="28" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="76" cy="78" r="4" fill="#0f766e"/><circle cx="84" cy="82" r="4" fill="#0f766e"/>
      <circle cx="79" cy="84" r="4" fill="#0f766e"/><circle cx="82" cy="76" r="4" fill="#0f766e"/>
      <text x="80" y="196" text-anchor="middle">Accurate + Precise</text>
      <text x="80" y="220" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">clustered on the true value</text>
    </g>

    <!-- Q2: precise, not accurate -->
    <g transform="translate(600,170)">
      <circle cx="80" cy="80" r="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="54" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="28" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="146" cy="52" r="4" fill="#b45309"/><circle cx="152" cy="60" r="4" fill="#b45309"/>
      <circle cx="150" cy="46" r="4" fill="#b45309"/><circle cx="144" cy="58" r="4" fill="#b45309"/>
      <text x="80" y="196" text-anchor="middle">Precise, Not Accurate</text>
      <text x="80" y="220" text-anchor="middle" font-size="14" font-weight="400" fill="#b45309">clustered, but consistently off</text>
    </g>

    <!-- Q3: accurate, not precise -->
    <g transform="translate(140,420)">
      <circle cx="80" cy="80" r="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="54" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="28" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="82" cy="80" r="4" fill="#0d9488"/><circle cx="40" cy="110" r="4" fill="#0d9488"/>
      <circle cx="118" cy="42" r="4" fill="#0d9488"/><circle cx="46" cy="50" r="4" fill="#0d9488"/>
      <text x="80" y="196" text-anchor="middle">Accurate, Not Precise</text>
      <text x="80" y="220" text-anchor="middle" font-size="14" font-weight="400" fill="#0d9488">scattered, but centered right</text>
    </g>

    <!-- Q4: neither -->
    <g transform="translate(600,420)">
      <circle cx="80" cy="80" r="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="54" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="80" cy="80" r="28" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="150" cy="40" r="4" fill="#b91c1c"/><circle cx="30" cy="120" r="4" fill="#b91c1c"/>
      <circle cx="140" cy="130" r="4" fill="#b91c1c"/><circle cx="20" cy="30" r="4" fill="#b91c1c"/>
      <text x="80" y="196" text-anchor="middle">Neither</text>
      <text x="80" y="220" text-anchor="middle" font-size="14" font-weight="400" fill="#b91c1c">scattered and off-target</text>
    </g>
  </g>

  <g font-size="16" fill="#134e4a">
    <text x="960" y="220" font-weight="700">A sensor can be precise</text>
    <text x="960" y="248" font-weight="700">but inaccurate</text>
    <text x="960" y="284" font-size="15" fill="#0f766e">— consistently wrong by the</text>
    <text x="960" y="306" font-size="15" fill="#0f766e">same amount — a genuinely</text>
    <text x="960" y="328" font-size="15" fill="#0f766e">common real-world case.</text>
  </g>

  <text x="640" y="672" text-anchor="middle" font-size="18" fill="#475569"><tspan font-weight="700" fill="#0f172a">RPLIDAR's own published tolerance</tspan> (Lesson 2) is a real accuracy figure — most consumer sensors publish only resolution, not this.</text>
</svg>
