<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>

  <text x="64" y="46" font-size="26" font-weight="800" fill="#134e4a">Two diagnostic paths, one shared start and end</text>
  <text x="64" y="70" font-size="14" fill="#64748b">Figure out which USB identity/driver component is affected, then walk that path's own ladder.</text>

  <!-- shared rungs before fork -->
  <g font-size="13" fill="#134e4a">
    <rect x="440" y="90" width="400" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="120" text-anchor="middle" font-weight="700">Connection/Setup — jazzy branch cloned?</text>

    <rect x="440" y="155" width="400" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="185" text-anchor="middle" font-weight="700">OS Detection — lsusb | grep 2bc5 shows two lines?</text>

    <rect x="440" y="220" width="400" height="50" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="250" text-anchor="middle" font-weight="700">rtprio granted before first launch?</text>
  </g>

  <!-- fork label -->
  <rect x="500" y="290" width="280" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="318" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">Which driver component is affected?</text>

  <line x1="640" y1="270" x2="640" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="600" y1="336" x2="300" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="680" y1="336" x2="980" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>

  <!-- Path 1: RGB/UVC -->
  <g>
    <rect x="140" y="380" width="360" height="34" rx="8" fill="#0f766e"/>
    <text x="320" y="404" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Path 1: RGB / UVC</text>

    <rect x="140" y="428" width="360" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⚠ Device not found</text>
    <text x="320" y="470" text-anchor="middle" font-size="12" fill="#7f1d1d">"Find device error &lt;reason&gt;" — node crashes</text>
    <text x="320" y="488" text-anchor="middle" font-size="11" fill="#7f1d1d">uvc_find_device exhausts 100 retries</text>

    <rect x="140" y="512" width="360" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⚠ Permission denied</text>
    <text x="320" y="554" text-anchor="middle" font-size="12" fill="#7f1d1d">"Permission denied opening /dev/bus/usb/..."</text>
    <text x="320" y="572" text-anchor="middle" font-size="11" fill="#7f1d1d">udev rule not applied/reloaded for 0501</text>
  </g>

  <!-- Path 2: depth/OpenNI2 -->
  <g>
    <rect x="780" y="380" width="360" height="34" rx="8" fill="#0f766e"/>
    <text x="960" y="404" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Path 2: Depth / OpenNI2</text>

    <rect x="780" y="428" width="360" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="960" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⚠ Semaphore hang</text>
    <text x="960" y="470" text-anchor="middle" font-size="12" fill="#7f1d1d">silent hang, no error at all</text>
    <text x="960" y="488" text-anchor="middle" font-size="11" fill="#7f1d1d">check: ls /dev/shm | grep astra</text>

    <rect x="780" y="512" width="360" height="90" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
    <text x="960" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">✓ no error — check the data itself</text>
    <text x="960" y="554" text-anchor="middle" font-size="12" fill="#134e4a">depth_registration silently false</text>
    <text x="960" y="572" text-anchor="middle" font-size="11" fill="#134e4a">point cloud publishes; color misaligned</text>
    <text x="960" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#134e4a">categorically different — no crash, no log</text>
  </g>

  <!-- rejoin -->
  <line x1="320" y1="584" x2="600" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="960" y1="602" x2="680" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>

  <g font-size="13" fill="#134e4a">
    <rect x="440" y="650" width="400" height="46" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="678" text-anchor="middle" font-weight="700">Node — ros2 node list shows astra_camera_node?</text>

    <rect x="440" y="708" width="400" height="46" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="736" text-anchor="middle" font-weight="700">Topics — ros2 topic list under /camera/...?</text>

    <rect x="440" y="766" width="400" height="46" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="794" text-anchor="middle" font-weight="700">Data — ros2 topic echo returns real values?</text>

    <rect x="440" y="824" width="400" height="46" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="640" y="852" text-anchor="middle" font-weight="700">Visualization — RViz2 Fixed Frame set to camera_link?</text>
  </g>

  <line x1="640" y1="140" x2="640" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="640" y1="205" x2="640" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="640" y1="696" x2="640" y2="708" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="640" y1="754" x2="640" y2="766" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
  <line x1="640" y1="812" x2="640" y2="824" stroke="#64748b" stroke-width="2" marker-end="url(#farrow)"/>
</svg>
