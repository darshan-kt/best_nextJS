<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="64" font-size="34" font-weight="800" fill="#134e4a">QoS is a compatibility contract</text>
  <text x="64" y="96" font-size="19" fill="#64748b">Same missing data, two very different causes.</text>

  <!-- left: compatible -->
  <g>
    <rect x="80" y="170" width="500" height="360" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="330" y="216" text-anchor="middle" font-size="19" font-weight="800" fill="#134e4a">Compatible</text>

    <rect x="130" y="260" width="180" height="80" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="220" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Publisher</text>
    <text x="220" y="316" text-anchor="middle" font-size="13" fill="#0f766e">RELIABLE</text>

    <rect x="370" y="260" width="180" height="80" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="460" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">RViz2</text>
    <text x="460" y="316" text-anchor="middle" font-size="13" fill="#0f766e">RELIABLE</text>

    <line x1="310" y1="300" x2="368" y2="300" stroke="#0d9488" stroke-width="5"/>
    <circle cx="339" cy="300" r="7" fill="#0d9488"/>

    <text x="330" y="400" text-anchor="middle" font-size="15" fill="#0f766e">RPLIDAR's real case — confirmed</text>
    <text x="330" y="422" text-anchor="middle" font-size="15" fill="#0f766e">from the driver's own source</text>
    <text x="330" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Data flows. No override needed.</text>
  </g>

  <!-- right: incompatible -->
  <g>
    <rect x="700" y="170" width="500" height="360" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="950" y="216" text-anchor="middle" font-size="19" font-weight="800" fill="#991b1b">Incompatible</text>

    <rect x="750" y="260" width="180" height="80" rx="12" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="840" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Publisher</text>
    <text x="840" y="316" text-anchor="middle" font-size="13" fill="#b91c1c">BEST_EFFORT</text>

    <rect x="990" y="260" width="180" height="80" rx="12" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="1080" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">RViz2</text>
    <text x="1080" y="316" text-anchor="middle" font-size="13" fill="#b91c1c">RELIABLE</text>

    <line x1="930" y1="300" x2="988" y2="300" stroke="#b91c1c" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="959" y="290" text-anchor="middle" font-size="22" fill="#b91c1c">✕</text>

    <text x="950" y="400" text-anchor="middle" font-size="15" fill="#b91c1c">A hypothetical future sensor</text>
    <text x="950" y="422" text-anchor="middle" font-size="15" fill="#b91c1c">using SensorDataQoS()</text>
    <text x="950" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">No data. No error either.</text>
  </g>

  <text x="640" y="672" text-anchor="middle" font-size="18" fill="#475569">This failure mode looks identical to <tspan font-weight="700" fill="#0f172a">"nothing is happening"</tspan> — but it has a specific, checkable cause.</text>
</svg>
