<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="64" font-size="34" font-weight="800" fill="#134e4a">Laser Safety Class 1</text>
  <text x="64" y="96" font-size="19" fill="#64748b">A real, checkable rating — not a marketing claim.</text>

  <!-- laser class symbol -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="220" height="220" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <circle cx="110" cy="90" r="46" fill="none" stroke="#b45309" stroke-width="6"/>
    <path d="M 110 44 L 118 80 L 154 88 L 118 100 L 110 136 L 102 100 L 66 88 L 102 80 Z" fill="#b45309"/>
    <text x="110" y="188" text-anchor="middle" font-size="26" font-weight="800" fill="#78350f">LASER</text>
    <text x="110" y="210" text-anchor="middle" font-size="22" font-weight="800" fill="#78350f">CLASS 1</text>
  </g>

  <g font-size="19" fill="#134e4a">
    <text x="420" y="210" font-weight="700">Class 1 means:</text>
    <text x="420" y="248" font-size="17" fill="#0f766e">Safe under normal operating conditions,</text>
    <text x="420" y="274" font-size="17" fill="#0f766e">including direct viewing.</text>

    <text x="420" y="330" font-weight="700">Confirmed directly from Slamtec's own</text>
    <text x="420" y="356" font-weight="700">official spec page — not assumed.</text>

    <rect x="420" y="400" width="720" height="110" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="440" y="436" font-size="17" font-weight="700" fill="#991b1b">Not a license for carelessness</text>
    <text x="440" y="462" font-size="15" fill="#7f1d1d">Don't stare into any laser source at close range as a</text>
    <text x="440" y="484" font-size="15" fill="#7f1d1d">matter of general practice — Class 1 describes the</text>
    <text x="440" y="500" font-size="14" fill="#7f1d1d" font-style="italic">device's normal operation, not an invitation to test it.</text>
  </g>

  <text x="640" y="620" text-anchor="middle" font-size="18" fill="#475569">Every device this course covers gets its safety information stated this precisely —</text>
  <text x="640" y="648" text-anchor="middle" font-size="18" fill="#475569"><tspan font-weight="700" fill="#0f172a">a real rating you can look up</tspan>, not a vague warning.</text>
</svg>
