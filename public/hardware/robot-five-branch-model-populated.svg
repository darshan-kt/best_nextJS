<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="64" font-size="34" font-weight="800" fill="#134e4a">The same five branches, filled in</text>
  <text x="64" y="96" font-size="17" fill="#64748b">This course's own devices, placed in the model.</text>

  <circle cx="640" cy="390" r="86" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="640" y="398" text-anchor="middle" font-size="24" font-weight="800" fill="#134e4a">ROBOT</text>

  <g stroke="#0d9488" stroke-width="3.5" marker-end="url(#arrow)" fill="none">
    <line x1="640" y1="304" x2="640" y2="188"/>
    <line x1="712" y1="340" x2="960" y2="220"/>
    <line x1="726" y1="440" x2="1030" y2="470"/>
    <line x1="554" y1="440" x2="250" y2="470"/>
    <line x1="568" y1="340" x2="320" y2="220"/>
  </g>

  <g font-size="16" font-weight="700" fill="#134e4a">
    <rect x="500" y="66" width="280" height="114" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="640" y="100" text-anchor="middle">SENSORS</text>
    <text x="640" y="126" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">RPLIDAR A2 (LaserScan)</text>
    <text x="640" y="148" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">Orbbec Astra Pro (RGB + depth)</text>
    <text x="640" y="168" text-anchor="middle" font-size="12" font-style="italic" font-weight="400" fill="#0f766e">this course's own devices</text>

    <rect x="960" y="130" width="250" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1085" y="166" text-anchor="middle" fill="#64748b">ACTUATORS</text>
    <text x="1085" y="192" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">not used in this course —</text>
    <text x="1085" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">sensor data only</text>

    <rect x="1010" y="470" width="260" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="1140" y="506" text-anchor="middle">COMPUTATION</text>
    <text x="1140" y="532" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">your Ubuntu 24.04 machine</text>
    <text x="1140" y="552" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">running ROS 2 Jazzy</text>

    <rect x="0" y="470" width="260" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="130" y="506" text-anchor="middle">COMMUNICATION</text>
    <text x="130" y="532" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">USB/serial (physical layer)</text>
    <text x="130" y="552" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">ROS 2 topics (Module 3)</text>

    <rect x="60" y="130" width="260" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="190" y="166" text-anchor="middle">POWER</text>
    <text x="190" y="192" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">USB port budget</text>
    <text x="190" y="212" text-anchor="middle" font-size="14" font-weight="400" fill="#0f766e">(Module 0's own numbers)</text>
  </g>

  <text x="640" y="670" text-anchor="middle" font-size="18" fill="#475569">Power <tspan font-weight="700" fill="#0f172a">isn't a side concern</tspan> — it's one of the five branches every robot needs, with real numbers behind it.</text>
</svg>
