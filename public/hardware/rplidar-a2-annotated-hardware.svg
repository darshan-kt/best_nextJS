<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="56" font-size="30" font-weight="800" fill="#134e4a">RPLIDAR A2 — physical components</text>
  <text x="64" y="86" font-size="18" fill="#64748b">Match this against your own unit before Section F's physical setup.</text>

  <!-- device silhouette: cylindrical base + rotating head -->
  <g>
    <ellipse cx="560" cy="520" rx="120" ry="26" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="440" y="420" width="240" height="100" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <ellipse cx="560" cy="420" rx="120" ry="26" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/>
    <!-- rotating head on top -->
    <ellipse cx="560" cy="330" rx="90" ry="22" fill="#ecfdf5" stroke="#134e4a" stroke-width="2.5"/>
    <rect x="470" y="270" width="180" height="60" fill="#ecfdf5" stroke="#134e4a" stroke-width="2.5"/>
    <ellipse cx="560" cy="270" rx="90" ry="22" fill="#f0fdfa" stroke="#134e4a" stroke-width="2.5"/>
    <!-- serial label -->
    <rect x="510" y="450" width="100" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="560" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">A2M8</text>
    <!-- cable -->
    <path d="M 680 500 C 760 500, 780 560, 860 580" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- adapter board -->
    <rect x="860" y="555" width="90" height="50" rx="6" fill="#f8fafc" stroke="#134e4a" stroke-width="2.5"/>
  </g>

  <!-- callouts -->
  <g font-size="14" fill="#134e4a">
    <line x1="560" y1="300" x2="200" y2="150" stroke="#0f766e" stroke-width="2" marker-end="url(#dot)"/>
    <text x="64" y="130" font-weight="700">Rotating head assembly</text>
    <text x="64" y="152" font-size="13" fill="#0f766e">laser emitter + angle-sensing receiver — never</text>
    <text x="64" y="172" font-size="13" fill="#0f766e">force it or hold it stationary while powered</text>

    <line x1="560" y1="470" x2="200" y2="600" stroke="#0f766e" stroke-width="2" marker-end="url(#dot)"/>
    <text x="64" y="620" font-weight="700">Base / motor housing</text>
    <text x="64" y="642" font-size="13" fill="#0f766e">brushless motor — quiet, low wear</text>

    <line x1="610" y1="465" x2="960" y2="330" stroke="#b45309" stroke-width="2" marker-end="url(#dot)"/>
    <text x="1240" y="310" text-anchor="end" font-weight="700" fill="#78350f">Model/serial label</text>
    <text x="1240" y="332" text-anchor="end" font-size="13" fill="#78350f">the single most setup-critical</text>
    <text x="1240" y="352" text-anchor="end" font-size="13" fill="#78350f">label on the device</text>

    <line x1="905" y1="580" x2="1100" y2="480" stroke="#0f766e" stroke-width="2" marker-end="url(#dot)"/>
    <text x="1240" y="460" text-anchor="end" font-weight="700">USB-to-serial adapter board</text>
    <text x="1240" y="482" text-anchor="end" font-size="13" fill="#0f766e">the CP2102 bridge chip — what</text>
    <text x="1240" y="502" text-anchor="end" font-size="13" fill="#0f766e">you actually hold and plug in</text>

    <line x1="770" y1="540" x2="1000" y2="600" stroke="#0f766e" stroke-width="2" marker-end="url(#dot)"/>
    <text x="1240" y="620" text-anchor="end" font-weight="700">Cable</text>
    <text x="1240" y="642" text-anchor="end" font-size="13" fill="#0f766e">head/base assembly to the adapter board</text>
  </g>
</svg>
