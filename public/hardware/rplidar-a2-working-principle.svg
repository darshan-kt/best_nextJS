<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="60" font-size="30" font-weight="800" fill="#134e4a">Laser triangulation, not time-of-flight</text>
  <text x="64" y="90" font-size="18" fill="#64748b">Distance is inferred from an angle, not a time delay.</text>

  <!-- emitter/receiver unit -->
  <rect x="110" y="330" width="140" height="90" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="150" cy="375" r="8" fill="#0d9488"/>
  <text x="150" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">EMITTER</text>
  <circle cx="210" cy="375" r="8" fill="#134e4a"/>
  <text x="210" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">RECEIVER</text>
  <text x="180" y="405" text-anchor="middle" font-size="12" fill="#0f766e">fixed, known offset</text>

  <!-- near object -->
  <rect x="620" y="200" width="50" height="140" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="645" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Near object</text>

  <!-- far object -->
  <rect x="1080" y="380" width="50" height="140" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1105" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Far object</text>

  <!-- laser lines to near object -->
  <line x1="150" y1="375" x2="632" y2="260" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="632" y1="260" x2="210" y2="375" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- laser lines to far object -->
  <line x1="150" y1="375" x2="1092" y2="440" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1092" y1="440" x2="210" y2="375" stroke="#134e4a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- angle callouts -->
  <text x="260" y="365" font-size="13" font-weight="700" fill="#0f766e">wide return angle</text>
  <text x="260" y="420" font-size="13" font-weight="700" fill="#134e4a">narrow return angle</text>

  <g font-size="15" fill="#134e4a">
    <text x="64" y="600" font-weight="700">A fixed emitter/receiver offset + a measured return angle = distance, by geometry alone.</text>
    <text x="64" y="628" fill="#0f766e">Closer objects return the laser spot at a noticeably different angle than farther ones —</text>
    <text x="64" y="652" fill="#0f766e">no clock, no timing circuit, just triangulation. This is why triangulation LiDAR is cheap.</text>
  </g>
</svg>
