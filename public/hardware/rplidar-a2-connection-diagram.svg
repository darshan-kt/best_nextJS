<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="64" font-size="30" font-weight="800" fill="#134e4a">Physical connection path</text>
  <text x="64" y="94" font-size="18" fill="#64748b">Confirm the sub-model label before any of this — Section C/F.</text>

  <g font-size="16" font-weight="700" fill="#134e4a">
    <rect x="48" y="280" width="220" height="130" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="158" y="330" text-anchor="middle">RPLIDAR A2</text>
    <text x="158" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">unit, confirmed</text>
    <text x="158" y="374" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">sub-model label</text>

    <rect x="336" y="280" width="220" height="130" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="446" y="330" text-anchor="middle">Cable</text>
    <text x="446" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">head/base assembly</text>
    <text x="446" y="374" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">to adapter board</text>

    <rect x="624" y="280" width="240" height="130" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="744" y="330" text-anchor="middle">USB-Serial Adapter</text>
    <text x="744" y="356" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">CP2102 bridge chip</text>
    <text x="744" y="374" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">(vendor 10c4:ea60)</text>

    <rect x="936" y="280" width="230" height="130" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/>
    <text x="1051" y="322" text-anchor="middle">Powered USB Hub</text>
    <text x="1051" y="348" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">not a bare laptop port —</text>
    <text x="1051" y="366" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">450–600 mA continuous</text>
    <text x="1051" y="384" text-anchor="middle" font-size="13" font-weight="400" fill="#0f766e">draw, Module 0 Lesson 4</text>
  </g>

  <g stroke="#0d9488" stroke-width="4.5" marker-end="url(#arrow)" fill="none">
    <line x1="272" y1="345" x2="332" y2="345"/>
    <line x1="560" y1="345" x2="620" y2="345"/>
    <line x1="868" y1="345" x2="932" y2="345"/>
  </g>

  <text x="640" y="500" text-anchor="middle" font-size="18" fill="#475569">Every hop is a physical connection, not yet software — <tspan font-weight="700" fill="#0f172a">Section G confirms the OS sees it</tspan>.</text>
</svg>
