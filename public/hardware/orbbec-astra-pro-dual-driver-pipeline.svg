<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="parrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="52" font-size="26" font-weight="800" fill="#134e4a">Two parallel driver components, one ROS 2 node process</text>
  <text x="64" y="78" font-size="15" fill="#64748b">Two USB identities, two internal driver classes, both hosted inside a single astra_camera_node.</text>

  <!-- sources -->
  <rect x="20" y="130" width="190" height="80" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="115" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">RGB / UVC sensor</text>
  <text x="115" y="184" text-anchor="middle" font-size="12" fill="#0f766e">USB 2bc5:0501</text>

  <rect x="20" y="500" width="190" height="80" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="115" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">OpenNI2 depth sensor</text>
  <text x="115" y="554" text-anchor="middle" font-size="12" fill="#0f766e">USB 2bc5:0403</text>

  <!-- shared node boundary -->
  <rect x="330" y="90" width="620" height="540" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="640" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#134e4a">astra_camera_node  (namespace /camera)</text>
  <text x="640" y="142" text-anchor="middle" font-size="12" fill="#0f766e">one ROS 2 process — precise language matters (Section H)</text>

  <!-- driver component boxes, inside the shared boundary -->
  <rect x="370" y="170" width="540" height="130" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="640" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">UVCCameraDriver</text>
  <text x="640" y="222" text-anchor="middle" font-size="12" fill="#64748b">RGB/UVC driver component</text>
  <text x="640" y="248" text-anchor="middle" font-size="12" fill="#0f766e">color_qos: default</text>
  <text x="640" y="270" text-anchor="middle" font-size="12" fill="#0f766e">camera_optical_color_frame</text>

  <rect x="370" y="420" width="540" height="180" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="640" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">OBCameraNode</text>
  <text x="640" y="472" text-anchor="middle" font-size="12" fill="#64748b">OpenNI2 depth/IR driver component</text>
  <text x="640" y="498" text-anchor="middle" font-size="12" fill="#0f766e">depth_qos / ir_qos: default</text>
  <text x="640" y="520" text-anchor="middle" font-size="12" fill="#0f766e">camera_depth_frame / camera_infra1_frame</text>
  <text x="640" y="546" text-anchor="middle" font-size="12" fill="#0f766e">enable_point_cloud: true (default)</text>

  <!-- outputs -->
  <rect x="1000" y="130" width="260" height="80" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1130" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">/camera/color/image_raw</text>
  <text x="1130" y="184" text-anchor="middle" font-size="12" fill="#0f766e">+ camera_info</text>

  <rect x="1000" y="390" width="260" height="80" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1130" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">/camera/depth/image_raw</text>
  <text x="1130" y="444" text-anchor="middle" font-size="12" fill="#0f766e">+ camera_info, /camera/ir/image_raw</text>

  <rect x="1000" y="500" width="260" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="1130" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">/camera/depth_registered/points</text>
  <text x="1130" y="552" text-anchor="middle" font-size="12" fill="#78350f">topic name from a remap</text>
  <text x="1130" y="572" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">depth_registration: false (default)</text>

  <!-- connecting arrows -->
  <g stroke="#0d9488" stroke-width="3.5" marker-end="url(#parrow)" fill="none">
    <path d="M 210 170 L 366 200"/>
    <path d="M 210 540 L 366 500"/>
    <path d="M 910 220 C 960 220, 960 165, 996 165"/>
    <path d="M 910 500 C 960 500, 960 425, 996 425"/>
    <path d="M 910 560 C 960 560, 960 545, 996 545"/>
  </g>

  <text x="640" y="672" text-anchor="middle" font-size="15" fill="#475569">"One ROS 2 node" contains <tspan font-weight="700" fill="#0f172a">two independent driver components</tspan> — the point-cloud topic's name doesn't mean its alignment default is on.</text>
</svg>
